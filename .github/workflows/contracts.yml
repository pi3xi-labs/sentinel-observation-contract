name: contracts-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Structure Lock
        run: python tools/validate_contracts.py

      - name: Behavior Lock
        run: python tests/evaluate_examples.py

      - name: Integrity Lock
        run: python tools/validate_manifest.py

      - name: Signature Lock
        run: python tools/validate_signature.py

      - name: Reproducibility
        run: |
          set -euo pipefail
          python tools/generate_manifest.py
          git diff --exit-code manifest/
          test -z "$(git status --porcelain manifest/)"
          echo "[PASS] manifest is reproducible"

      - name: Tag format
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^contracts-v[0-9]+\.[0-9]+$ ]]; then
            echo "[FAIL] tag '$TAG' does not match ^contracts-v[0-9]+\.[0-9]+$"
            exit 1
          fi
          echo "[PASS] tag format: $TAG"
