name: contracts-check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Structure Lock
        run: python tools/validate_contracts.py

      - name: Behavior Lock
        run: python tests/evaluate_examples.py

      - name: Integrity Lock
        run: python tools/validate_manifest.py
